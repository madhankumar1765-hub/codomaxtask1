<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog - MyBlog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


<header>
    <h2>MyBlog</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>
</header>

<div class="form-container">
    <h2>Create a New Blog</h2>

    <form id="blogForm">
        <input type="text" id="blogTitle" placeholder="Enter blog title" required>

        <textarea id="blogContent" placeholder="Write your blog content..." rows="8" required></textarea>

        <button type="submit" class="btn">Publish Blog</button>
    </form>

    <p id="blogMessage"></p>
</div>

<script src="script.js"></script>


</body>
</html>
